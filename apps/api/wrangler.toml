# Cấp gốc = chạy local (`wrangler dev`). Tên khác Production để lỡ `wrangler deploy` thiếu `--env production`
# cũng không ghi đè Worker thật. Deploy: docs/deployment/cloudflare.md.
name = "crm-api-dev"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Biến công khai. Secret (SUPABASE_SERVICE_ROLE_KEY) đặt bằng `wrangler secret put`,
# khi chạy local thì đặt trong apps/api/.dev.vars (xem .dev.vars.example).
[vars]
ALLOWED_ORIGINS = "http://localhost:5173"

# 01:00 UTC = 08:00 giờ Việt Nam: thông báo việc sắp đến hạn / quá hạn (modules/notifications).
[triggers]
crons = ["0 1 * * *"]

# ---------- Production: Worker crm-api, Supabase umsabjhsemgsbrqmqjgv ----------
# vars / triggers không kế thừa từ cấp gốc nên khai báo lại. Secret SUPABASE_SERVICE_ROLE_KEY:
# `wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production` (không bao giờ ghi vào file).
[env.production]
name = "crm-api"

[env.production.vars]
SUPABASE_URL = "https://umsabjhsemgsbrqmqjgv.supabase.co"
# Chỉ domain web Production thật (không `*`, không mọi *.vercel.app). Rỗng = chưa trình duyệt nào gọi được —
# điền khi có domain Vercel rồi deploy lại.
ALLOWED_ORIGINS = ""

[env.production.triggers]
crons = ["0 1 * * *"]
